version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    env_file:
      - .env
    ports:
      - '3001:3001'
    depends_on:
      - mongo

volumes:
  mongo_data:
