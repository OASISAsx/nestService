version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db # 👈 ต้องเป็น array และมี -

  backend:
    build: .
    env_file:
      - .env
    ports:
      - '3001:3001'
    depends_on:
      - mongo

# 👇 ส่วนนี้คือการ "ประกาศ volume"
volumes:
  mongo_data:
    name: nestservice_mongo_data # 👈 ล็อกชื่อจริงตรงนี้
