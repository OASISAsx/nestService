name: CI/CD Backend Production

permissions:
  contents: write

on:
  push:
    branches:
      - dev

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # 📥 Checkout
      # =====================
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # =====================
      # 📦 Setup Node
      # =====================
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # =====================
      # 📚 Install deps
      # =====================
      - name: Install dependencies
        run: npm install

      # =====================
      # 🧪 Run tests (CI)
      # =====================
      - name: Run unit tests
        run: npm run test

      # =====================
      # ✅ Auto merge dev -> build
      # =====================
      - name: Merge dev into build
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin

          # checkout build (create if not exist)
          git checkout build || git checkout -b build

          # reset build ให้ตรง remote (กัน conflict)
          git reset --hard origin/build || true

          # merge dev
          git merge origin/dev --no-edit

          # push to build
          git push origin build

      # =====================
      # 🚀 Deploy production
      # =====================
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /root/nestService

            git fetch origin
            git reset --hard origin/build

            docker compose down --remove-orphans
            docker compose up -d --build

            docker image prune -f
